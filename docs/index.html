<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Editor</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
        }

        #canvas {
            display: grid;
            grid-template-columns: repeat(16, 24px);
            grid-template-rows: repeat(16, 24px);
            gap: 1px;
            justify-content: center;
            margin-top: 20px;
        }

        .pixel {
            width: 24px;
            height: 24px;
            background-color: white;
            border: 1px solid #cccccc;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>Pixel Art Editor</h1>

    <div id="size-controls">
        <label>
            Width:
            <input type="number" id="canvas-width" value="16" min="1">
        </label>

        <label>
            Height:
            <input type="number" id="canvas-height" value="16" min="1">
        </label>

        <button id="resize-button">Resize</button>
    </div>

    <div id="canvas"></div>

    <script>
        for (let i = 0; i < 16 * 16; i++) {
            const pixel = document.createElement("div");
        
            pixel.className = "pixel";
        
            pixel.addEventListener("click", function () {
                pixel.dataset.block = "RedConcrete";
                pixel.style.backgroundColor = "#b02e26";
            });

            canvas.appendChild(pixel);
        }
    </script>

</body>
</html>
