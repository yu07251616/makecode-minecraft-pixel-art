<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Editor</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
        }

        #canvas {
            display: grid;
            grid-template-columns: repeat(16, 24px);
            grid-template-rows: repeat(16, 24px);
            gap: 1px;
            justify-content: center;
            margin-top: 20px;
        }

        .pixel {
            width: 24px;
            height: 24px;
            background-color: white;
            border: 1px solid #cccccc;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>Pixel Art Editor</h1>

    <div id="size-controls">
        <label>
            Width:
            <input type="number" id="canvas-width" value="16" min="1">
        </label>

        <label>
            Height:
            <input type="number" id="canvas-height" value="16" min="1">
        </label>

        <button id="resize-button">Resize</button>
    </div>

    <div id="block-palette">
        <p>Select Block:</p>
    
        <button
            class="block-button"
            data-block="RedConcrete"
            data-color="#b02e26">
            Red Concrete
        </button>
    
        <button
            class="block-button"
            data-block="WhiteTerracotta"
            data-color="#d1b1a1">
            White Terracotta
        </button>

        <button
            class="block-button"
            data-block="Empty"
            data-color="white">
            Eraser
        </button>
    </div>
    
    <div id="canvas"></div>

    <script>
        const canvas = document.getElementById("canvas");
        const widthInput = document.getElementById("canvas-width");
        const heightInput = document.getElementById("canvas-height");
        const resizeButton = document.getElementById("resize-button");
    
        const blockButtons = document.querySelectorAll(".block-button");
    
        let selectedBlock = "RedConcrete";
        let selectedColor = "#b02e26";

        let isDrawing = false;

        let canvasWidth = 16;
        let canvasHeight = 16;

        let pixelData = new Array(canvasWidth * canvasHeight).fill("Empty");

        function paintPixel(pixel) {
            const index = Number(pixel.dataset.index);

            pixelData[index] = selectedBlock;
        
            pixel.dataset.block = selectedBlock;
            pixel.style.backgroundColor = selectedColor;
        }

        function getBlockColor(block) {
            const blockColors = {
                Empty: "white",
        
                WhiteConcrete: "#cfd5d6",
                OrangeConcrete: "#e06101",
                MagentaConcrete: "#a9309f",
                LightBlueConcrete: "#2389c6",
                YellowConcrete: "#f1af15",
                LimeConcrete: "#5ea818",
                PinkConcrete: "#d5658e",
                GrayConcrete: "#36393d",
                LightGrayConcrete: "#7d7d73",
                CyanConcrete: "#157788",
                PurpleConcrete: "#64209c",
                BlueConcrete: "#2c2e8f",
                BrownConcrete: "#603b1f",
                GreenConcrete: "#495b24",
                RedConcrete: "#8e2121",
                BlackConcrete: "#080a0f",
        
                WhiteTerracotta: "#d1b1a1"
            };

            return blockColors[block] || "white";
        }
    
        blockButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                selectedBlock = button.dataset.block;
                selectedColor = button.dataset.color;
            });
        });
    
        function createCanvas(width, height) {
            canvas.innerHTML = "";
    
            canvas.style.gridTemplateColumns = `repeat(${width}, 24px)`;
            canvas.style.gridTemplateRows = `repeat(${height}, 24px)`;
    
            for (let i = 0; i < width * height; i++) {
                const pixel = document.createElement("div");
    
                pixel.className = "pixel";
                pixel.dataset.index = i;

                pixel.dataset.block = pixelData[i];
                pixel.style.backgroundColor = getBlockColor(pixelData[i]);
    
                pixel.addEventListener("pointerdown", function () {
                    isDrawing = true;
                    paintPixel(pixel);
                });

                pixel.addEventListener("pointerenter", function () {
                    if (isDrawing) {
                        paintPixel(pixel);
                    }
                });
    
                canvas.appendChild(pixel);
            }
        }

        document.addEventListener("pointerup", function () {
            isDrawing = false;
        });
    
        createCanvas(16, 16);
    
        resizeButton.addEventListener("click", function () {
            const newWidth = Number(widthInput.value);
            const newHeight = Number(heightInput.value);
        
            if (newWidth < 1 || newHeight < 1) {
                return;
            }
        
            const newPixelData =
                new Array(newWidth * newHeight).fill("Empty");
        
            const copyWidth = Math.min(canvasWidth, newWidth);
            const copyHeight = Math.min(canvasHeight, newHeight);
        
            for (let y = 0; y < copyHeight; y++) {
                for (let x = 0; x < copyWidth; x++) {
        
                    const oldIndex =
                        x + y * canvasWidth;
        
                    const newIndex =
                        x + y * newWidth;
        
                    newPixelData[newIndex] =
                        pixelData[oldIndex];
                }
            }
        
            canvasWidth = newWidth;
            canvasHeight = newHeight;
            pixelData = newPixelData;
        
            createCanvas(canvasWidth, canvasHeight);
        });
    </script>

</body>
</html>
