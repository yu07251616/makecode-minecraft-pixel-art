<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Editor</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
        }

        #canvas {
            display: grid;
            grid-template-columns: repeat(16, 24px);
            grid-template-rows: repeat(16, 24px);
            gap: 1px;
            justify-content: center;
            margin-top: 20px;
        }

        .pixel {
            width: 24px;
            height: 24px;
            background-color: white;
            border: 1px solid #cccccc;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>Pixel Art Editor</h1>

    <div id="size-controls">
        <label>
            横:
            <input type="number" id="canvas-width" value="16" min="1">
        </label>

        <label>
            縦:
            <input type="number" id="canvas-height" value="16" min="1">
        </label>

        <button id="resize-button">リサイズ</button>
    </div>

    <div id="block-palette">
        <p>Select Block:</p>
    
        <button class="block-button" data-block="WhiteConcrete" data-color="#cfd5d6">
            白色のコンクリート
        </button>
        
        <button class="block-button" data-block="OrangeConcrete" data-color="#e06101">
            橙色のコンクリート
        </button>
        
        <button class="block-button" data-block="MagentaConcrete" data-color="#a9309f">
            赤紫色のコンクリート
        </button>
        
        <button class="block-button" data-block="LightBlueConcrete" data-color="#2389c6">
            空色のコンクリート
        </button>
        
        <button class="block-button" data-block="YellowConcrete" data-color="#f1af15">
            黄色のコンクリート
        </button>
        
        <button class="block-button" data-block="LimeConcrete" data-color="#5ea818">
            黄緑色のコンクリート
        </button>
        
        <button class="block-button" data-block="PinkConcrete" data-color="#d5658e">
            桃色のコンクリート
        </button>
        
        <button class="block-button" data-block="GrayConcrete" data-color="#36393d">
            灰色のコンクリート
        </button>
        
        <button class="block-button" data-block="LightGrayConcrete" data-color="#7d7d73">
            薄灰色のコンクリート
        </button>
        
        <button class="block-button" data-block="CyanConcrete" data-color="#157788">
            青緑色のコンクリート
        </button>
        
        <button class="block-button" data-block="PurpleConcrete" data-color="#64209c">
            紫色のコンクリート
        </button>
        
        <button class="block-button" data-block="BlueConcrete" data-color="#2c2e8f">
            青色のコンクリート
        </button>
        
        <button class="block-button" data-block="BrownConcrete" data-color="#603b1f">
            茶色のコンクリート
        </button>
        
        <button class="block-button" data-block="GreenConcrete" data-color="#495b24">
            緑色のコンクリート
        </button>
        
        <button class="block-button" data-block="RedConcrete" data-color="#8e2121">
            赤色のコンクリート
        </button>
        
        <button class="block-button" data-block="BlackConcrete" data-color="#080a0f">
            黒色のコンクリート
        </button>
    
        <button class="block-button" data-block="WhiteTerracotta" data-color="#d1b1a1">
            白色のテラコッタ
        </button>
        
        <button class="block-button" data-block="OrangeTerracotta" data-color="#9f5224">
            橙色のテラコッタ
        </button>
        
        <button class="block-button" data-block="MagentaTerracotta" data-color="#95576c">
            赤紫色のテラコッタ
        </button>
        
        <button class="block-button" data-block="LightBlueTerracotta" data-color="#706c8a">
            空色のテラコッタ
        </button>
        
        <button class="block-button" data-block="YellowTerracotta" data-color="#ba8524">
            黄色のテラコッタ
        </button>
        
        <button class="block-button" data-block="LimeTerracotta" data-color="#677535">
            黄緑色のテラコッタ
        </button>
        
        <button class="block-button" data-block="PinkTerracotta" data-color="#a04d4e">
            桃色のテラコッタ
        </button>
        
        <button class="block-button" data-block="GrayTerracotta" data-color="#392a23">
            灰色のテラコッタ
        </button>
        
        <button class="block-button" data-block="LightGrayTerracotta" data-color="#876b62">
            薄灰色のテラコッタ
        </button>
        
        <button class="block-button" data-block="CyanTerracotta" data-color="#575c5c">
            青緑色のテラコッタ
        </button>
        
        <button class="block-button" data-block="PurpleTerracotta" data-color="#7a4958">
            紫色のテラコッタ
        </button>
        
        <button class="block-button" data-block="BlueTerracotta" data-color="#4c3e5c">
            青色のテラコッタ
        </button>
        
        <button class="block-button" data-block="BrownTerracotta" data-color="#4d3323">
            茶色のテラコッタ
        </button>
        
        <button class="block-button" data-block="GreenTerracotta" data-color="#4c522a">
            緑色のテラコッタ
        </button>
        
        <button class="block-button" data-block="RedTerracotta" data-color="#8f3b2e">
            赤色のテラコッタ
        </button>
        
        <button class="block-button" data-block="BlackTerracotta" data-color="#251610">
            黒色のテラコッタ
        </button>

        <button
            class="block-button"
            data-block="Empty"
            data-color="white">
            消しゴム
        </button>
    </div>
    
    <div id="canvas"></div>

    <div id="export-area">
        <button id="export-button">
            エクスポート
        </button>

        <button id="copy-button">
            コピー
        </button>

        <br><br>

        <textarea
            id="export-output"
            rows="6"
            cols="60"
            readonly>
        </textarea>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const widthInput = document.getElementById("canvas-width");
        const heightInput = document.getElementById("canvas-height");
        const resizeButton = document.getElementById("resize-button");
        const exportButton = document.getElementById("export-button");
        const exportOutput = document.getElementById("export-output");
        const copyButton = document.getElementById("copy-button");
    
        const blockButtons = document.querySelectorAll(".block-button");
    
        let selectedBlock = "RedConcrete";
        let selectedColor = "#b02e26";

        let isDrawing = false;

        let canvasWidth = 16;
        let canvasHeight = 16;

        let pixelData = new Array(canvasWidth * canvasHeight).fill("Empty");

        let history = [];
        let redoHistory = [];
        const maxHistory = 50;

        function saveHistory() {
            history.push([...pixelData]);
        
            if (history.length > maxHistory) {
                history.shift();
            }
        }

        function paintPixel(pixel) {
            const index = Number(pixel.dataset.index);

            pixelData[index] = selectedBlock;
        
            pixel.dataset.block = selectedBlock;
            pixel.style.backgroundColor = selectedColor;
        }

        function getBlockColor(block) {
            const blockColors = {
                Empty: "white",
        
                WhiteConcrete: "#cfd5d6",
                OrangeConcrete: "#e06101",
                MagentaConcrete: "#a9309f",
                LightBlueConcrete: "#2389c6",
                YellowConcrete: "#f1af15",
                LimeConcrete: "#5ea818",
                PinkConcrete: "#d5658e",
                GrayConcrete: "#36393d",
                LightGrayConcrete: "#7d7d73",
                CyanConcrete: "#157788",
                PurpleConcrete: "#64209c",
                BlueConcrete: "#2c2e8f",
                BrownConcrete: "#603b1f",
                GreenConcrete: "#495b24",
                RedConcrete: "#8e2121",
                BlackConcrete: "#080a0f",
        
                WhiteTerracotta: "#d1b1a1",
                OrangeTerracotta: "#9f5224",
                MagentaTerracotta: "#95576c",
                LightBlueTerracotta: "#706c8a",
                YellowTerracotta: "#ba8524",
                LimeTerracotta: "#677535",
                PinkTerracotta: "#a04d4e",
                GrayTerracotta: "#392a23",
                LightGrayTerracotta: "#876b62",
                CyanTerracotta: "#575c5c",
                PurpleTerracotta: "#7a4958",
                BlueTerracotta: "#4c3e5c",
                BrownTerracotta: "#4d3323",
                GreenTerracotta: "#4c522a",
                RedTerracotta: "#8f3b2e",
                BlackTerracotta: "#251610"
            };

            return blockColors[block] || "white";
        }

        function getBlockId(block) {
            const blockIds = {
                Empty: 0,
        
                WhiteConcrete: 1,
                OrangeConcrete: 2,
                MagentaConcrete: 3,
                LightBlueConcrete: 4,
                YellowConcrete: 5,
                LimeConcrete: 6,
                PinkConcrete: 7,
                GrayConcrete: 8,
                LightGrayConcrete: 9,
                CyanConcrete: 10,
                PurpleConcrete: 11,
                BlueConcrete: 12,
                BrownConcrete: 13,
                GreenConcrete: 14,
                RedConcrete: 15,
                BlackConcrete: 16,
        
                WhiteTerracotta: 17,
                OrangeTerracotta: 18,
                MagentaTerracotta: 19,
                LightBlueTerracotta: 20,
                YellowTerracotta: 21,
                LimeTerracotta: 22,
                PinkTerracotta: 23,
                GrayTerracotta: 24,
                LightGrayTerracotta: 25,
                CyanTerracotta: 26,
                PurpleTerracotta: 27,
                BlueTerracotta: 28,
                BrownTerracotta: 29,
                GreenTerracotta: 30,
                RedTerracotta: 31,
                BlackTerracotta: 32
            };
        
            return blockIds[block];
        }
    
        blockButtons.forEach(function (button) {

            // 消しゴム以外には色の見本を付ける
            if (button.dataset.block !== "Empty") {
                const colorSample = document.createElement("span");
        
                colorSample.style.display = "inline-block";
                colorSample.style.width = "14px";
                colorSample.style.height = "14px";
                colorSample.style.marginLeft = "8px";
                colorSample.style.verticalAlign = "middle";
                colorSample.style.border = "1px solid #666";
                colorSample.style.backgroundColor = button.dataset.color;
        
                button.appendChild(colorSample);
            }
        
            button.addEventListener("click", function () {
                selectedBlock = button.dataset.block;
                selectedColor = button.dataset.color;
            });
        });
    
        function createCanvas(width, height) {
            canvas.innerHTML = "";
    
            canvas.style.gridTemplateColumns = `repeat(${width}, 24px)`;
            canvas.style.gridTemplateRows = `repeat(${height}, 24px)`;
    
            for (let i = 0; i < width * height; i++) {
                const pixel = document.createElement("div");
    
                pixel.className = "pixel";
                pixel.dataset.index = i;

                pixel.dataset.block = pixelData[i];
                pixel.style.backgroundColor = getBlockColor(pixelData[i]);
    
                pixel.addEventListener("pointerdown", function () {
                    saveHistory();
                    isDrawing = true;
                    paintPixel(pixel);
                });

                pixel.addEventListener("pointerenter", function () {
                    if (isDrawing) {
                        paintPixel(pixel);
                    }
                });
    
                canvas.appendChild(pixel);
            }
        }

        document.addEventListener("pointerup", function () {
            isDrawing = false;
        });
    
        createCanvas(16, 16);
    
        resizeButton.addEventListener("click", function () {
            const newWidth = Number(widthInput.value);
            const newHeight = Number(heightInput.value);
        
            if (newWidth < 1 || newHeight < 1) {
                return;
            }
        
            const newPixelData =
                new Array(newWidth * newHeight).fill("Empty");
        
            const copyWidth = Math.min(canvasWidth, newWidth);
            const copyHeight = Math.min(canvasHeight, newHeight);
        
            for (let y = 0; y < copyHeight; y++) {
                for (let x = 0; x < copyWidth; x++) {
        
                    const oldIndex =
                        x + y * canvasWidth;
        
                    const newIndex =
                        x + y * newWidth;
        
                    newPixelData[newIndex] =
                        pixelData[oldIndex];
                }
            }
        
            canvasWidth = newWidth;
            canvasHeight = newHeight;
            pixelData = newPixelData;
        
            createCanvas(canvasWidth, canvasHeight);
        });

        exportButton.addEventListener("click", function () {
            const blockIds = [];
        
            for (let i = 0; i < pixelData.length; i++) {
                blockIds.push(getBlockId(pixelData[i]));
            }
        
            exportOutput.value =
                canvasWidth +
                "," +
                canvasHeight +
                "|" +
                blockIds.join(",");
        });

        copyButton.addEventListener("click", function () {
            navigator.clipboard.writeText(exportOutput.value);
        });

        document.addEventListener("keydown", function (event) {
            const activeElement = document.activeElement;
        
            // Ctrl+Zで一つ前の状態へ戻す
            if (
                activeElement.tagName === "INPUT" ||
                activeElement.tagName === "TEXTAREA"
            ) {
                return;
            }

            // Ctrl+Z : Undo
            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "z"
            ) {
                if (history.length === 0) {
                    return;
                }
        
                event.preventDefault();

                // Undoする前の状態をRedo用に保存
                redoHistory.push([...pixelData]);
                
                if (redoHistory.length > maxHistory) {
                    redoHistory.shift();
                }
                
                // 1つ前の状態へ戻す
                pixelData = history.pop();
                
                createCanvas(
                    canvasWidth,
                    canvasHeight
                );

                return;
            }

            // Ctrl+Y : Redo
            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "y"
            ) {
                if (redoHistory.length === 0) {
                    return;
                }
            
                event.preventDefault();
            
                // Redoする前の状態をUndo用に保存
                history.push([...pixelData]);
            
                if (history.length > maxHistory) {
                    history.shift();
                }
            
                // 1つ先の状態へ進む
                pixelData = redoHistory.pop();
            
                createCanvas(
                    canvasWidth,
                    canvasHeight
                );
            }
        });
    </script>

</body>
</html>
